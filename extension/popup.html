<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Problem Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { width: 360px; min-height: 0; margin: 0; background: #080b12; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2d40; border-radius: 4px; }

    .gradient-text {
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }

    .action-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      width: 100%;
    }
    .action-btn:hover {
      background: rgba(96,165,250,0.12);
      border-color: rgba(96,165,250,0.3);
      transform: translateY(-1px);
    }
    .action-btn .icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 14px;
      flex: 1;
    }

    .review-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .review-item strong {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .review-actions { display: flex; gap: 6px; }
    .review-actions button {
      flex: 1;
      padding: 4px 0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .review-actions button[data-q="1"] { background: rgba(239,68,68,0.15); color: #f87171; }
    .review-actions button[data-q="1"]:hover { background: rgba(239,68,68,0.3); }
    .review-actions button[data-q="3"] { background: rgba(234,179,8,0.15); color: #fbbf24; }
    .review-actions button[data-q="3"]:hover { background: rgba(234,179,8,0.3); }
    .review-actions button[data-q="5"] { background: rgba(34,197,94,0.15); color: #4ade80; }
    .review-actions button[data-q="5"]:hover { background: rgba(34,197,94,0.3); }

    .input-field {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field::placeholder { color: #475569; }
    .input-field:focus { border-color: rgba(96,165,250,0.5); background: rgba(96,165,250,0.05); }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: none;
      border-radius: 10px;
      padding: 11px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 20px rgba(37,99,235,0.3);
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 24px rgba(37,99,235,0.4);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div style="padding: 16px 16px 0;">
    <header style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" fill="white" width="16" height="16"><path d="M6 3v18l6-4 6 4V3H6z"/></svg>
        </div>
        <div>
          <div class="gradient-text" style="font-size:14px;font-weight:700;line-height:1;">Problem Tracker</div>
          <div style="font-size:10px;color:#475569;margin-top:1px;">v2.0</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="pulse-dot"></div>
        <span style="font-size:10px;color:#4ade80;font-weight:500;">Live</span>
      </div>
    </header>
  </div>

  <div style="padding: 0 16px 16px;">

    <!-- Login Section -->
    <div id="login-section" class="hidden" style="display:none;">
      <div style="text-align:center; padding: 8px 0 20px;">
        <div style="font-size:28px; margin-bottom:8px;">🧠</div>
        <div style="font-size:14px;font-weight:600;color:#e2e8f0;margin-bottom:4px;">Welcome back</div>
        <div style="font-size:12px;color:#475569;">Sign in to sync your progress</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <input type="text" id="username" placeholder="Username" class="input-field" />
        <input type="password" id="password" placeholder="Password" class="input-field" />
        <button id="login-btn" class="login-btn">Login / Register</button>
        <div style="font-size:11px;color:#334155;text-align:center;">New user? Just type a username & password to register.</div>
      </div>
    </div>

    <!-- Main Section -->
    <div id="main-section" style="display:none;">
      <!-- Stats Row -->
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <div class="stat-card">
          <div style="font-size:10px;color:#60a5fa;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Reviews Done</div>
          <div id="today-reviews" style="font-size:20px;font-weight:700;color:#f8fafc;font-variant-numeric:tabular-nums;">0</div>
        </div>
        <div class="stat-card">
          <div style="font-size:10px;color:#a78bfa;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Bookmarks</div>
          <div id="today-bookmarks" style="font-size:20px;font-weight:700;color:#f8fafc;font-variant-numeric:tabular-nums;">0</div>
        </div>
        <div class="stat-card" style="text-align:center;">
          <div style="font-size:10px;color:#f87171;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">Due</div>
          <div id="due-count" style="font-size:20px;font-weight:700;color:#f8fafc;font-variant-numeric:tabular-nums;">0</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
        <button id="bookmark-btn" class="action-btn">
          <div class="icon" style="background:rgba(96,165,250,0.15);">🔖</div>
          <div>
            <div style="font-weight:600;font-size:13px;">Bookmark This Problem</div>
            <div style="font-size:11px;color:#475569;margin-top:1px;">Save & sync to your account</div>
          </div>
        </button>
        <button id="revisit-btn" class="action-btn">
          <div class="icon" style="background:rgba(167,139,250,0.15);">🔁</div>
          <div>
            <div style="font-weight:600;font-size:13px;">Schedule for Review</div>
            <div style="font-size:11px;color:#475569;margin-top:1px;">SM-2 spaced repetition</div>
          </div>
        </button>
      </div>

      <!-- View All -->
      <div style="text-align:center;margin-bottom:16px;">
        <button id="view-all-btn" style="background:none;border:none;color:#60a5fa;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all 0.2s;" onmouseover="this.style.background='rgba(96,165,250,0.1)'" onmouseout="this.style.background='none'">View all bookmarks →</button>
      </div>

      <!-- Due for Review -->
      <div id="review-section" style="display:none;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <div style="width:3px;height:14px;background:linear-gradient(135deg,#f87171,#fb923c);border-radius:2px;"></div>
          <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;">Due for Review</span>
        </div>
        <ul id="review-list" style="display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0;max-height:180px;overflow-y:auto;"></ul>
      </div>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
